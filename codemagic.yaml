workflows:
  ios_testflight:
    name: Future Call - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ReminderSchedulerApp.xcodeproj"
        XCODE_SCHEME: "ReminderSchedulerApp"
        BUNDLE_ID: "com.pguuu.futurecall"
        APP_STORE_APP_ID: "" # Fill in after the App Store Connect app record exists.
    scripts:
      - name: Show build context
        script: |
          xcodebuild -version
          xcodebuild -list -project "$XCODE_PROJECT"
      - name: Apply Codemagic signing profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        expire_build_submitted_for_review: false
