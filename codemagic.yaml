workflows:
  ios_testflight:
    name: Future Call - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.pguuu.futurecall"
      vars:
        XCODE_PROJECT: "ReminderSchedulerApp.xcodeproj"
        XCODE_SCHEME: "ReminderSchedulerApp"
        BUNDLE_ID: "com.pguuu.futurecall"
        APP_STORE_APP_ID: "6788156334"
    scripts:
      - name: Show build context
        script: |
          xcodebuild -version
          xcodebuild -list -project "$XCODE_PROJECT"
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Apply Codemagic signing profiles
        script: |
          xcode-project use-profiles
      - name: Set unique Apple build number
        script: |
          APP_BUILD_NUMBER="${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          echo "Using Apple build number $APP_BUILD_NUMBER"
          agvtool new-version -all "$APP_BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Ensure IPA artifact exists
        script: |
          if [ -d build/ios/ipa ] && find build/ios/ipa -name "*.ipa" -print -quit | grep -q .; then
            find build/ios/ipa -name "*.ipa" -print
            exit 0
          fi

          ARCHIVE_PATH="$(find build/ios/xcarchive -name "*.xcarchive" -print -quit)"
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Unable to find exported IPA or xcarchive."
            exit 1
          fi

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Unable to find archived app inside $ARCHIVE_PATH."
            exit 1
          fi

          IPA_NAME="${XCODE_SCHEME}.ipa"
          PACKAGE_ROOT="$(mktemp -d)"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$APP_PATH" "$PACKAGE_ROOT/Payload/"
          mkdir -p build/ios/ipa
          ditto -c -k --norsrc "$PACKAGE_ROOT" "build/ios/ipa/$IPA_NAME"
          ls -lh "build/ios/ipa/$IPA_NAME"
    artifacts:
      - build/ios/ipa/**/*.ipa
      - build/ios/ipa/**/*
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
