workflows:
  ios_testflight:
    name: Future Call - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.pguuu.futurecall"
      vars:
        XCODE_PROJECT: "ReminderSchedulerApp.xcodeproj"
        XCODE_SCHEME: "ReminderSchedulerApp"
        BUNDLE_ID: "com.pguuu.futurecall"
        APP_STORE_APP_ID: "6788156334"
    scripts:
      - name: Show build context
        script: |
          xcodebuild -version
          xcodebuild -list -project "$XCODE_PROJECT"
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Apply Codemagic signing profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/**/*.ipa
      - build/ios/ipa/**/*
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        expire_build_submitted_for_review: false
